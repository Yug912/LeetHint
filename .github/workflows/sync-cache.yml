# Weekly: turn the week's new problems (already generated by the Worker's
# Monday cron, so mostly cache hits) into static files in the leethint-cache
# repo, and refresh its companies.json. Pages redeploys on its own.
#
# One-time setup: in this repo's Settings → Secrets and variables → Actions,
# add CACHE_REPO_TOKEN — a fine-grained GitHub token with "Contents: read and
# write" on Yug912/leethint-cache only.
name: sync-cache

on:
  schedule:
    - cron: "0 12 * * 1"      # Mondays 12:00 UTC, after the Worker's 06:00–09:40 runs
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new files this run"
        default: "30"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Yug912/leethint-cache
          token: ${{ secrets.CACHE_REPO_TOKEN }}
          path: cache-repo

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate missing hint files (g++ compile check on the runner)
        run: |
          node tools/prefill.mjs \
            --server https://leethint-api.yugthakral07.workers.dev \
            --out cache-repo \
            --limit "${{ github.event.inputs.limit || '30' }}" \
            --delay 20

      - name: Refresh company tags
        run: cp data/companies.json cache-repo/companies.json

      - name: Commit and push new files
        working-directory: cache-repo
        run: |
          git config user.name "leethint-bot"
          git config user.email "leethint-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Weekly hint sync ($(date -u +%F))"
          git push
