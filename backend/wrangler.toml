# LeetHint API — Cloudflare Worker
# API keys are NOT configured here. Set them as encrypted secrets:
#   npx wrangler secret put GROQ_API_KEY
# (see backend/README.md). For local dev, put them in backend/.dev.vars (gitignored).

name = "leethint-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Keep request logs (provider used, failures) viewable in the Cloudflare dashboard
[observability]
enabled = true

# Monday 06:00 UTC: generate hints for LeetCode's newest problems (refresh.js).
# Try it locally: npx wrangler dev --test-scheduled, then open
# http://localhost:8787/__scheduled?cron=0+6+*+*+1
[triggers]
crons = ["0 6 * * 1"]

[vars]
# Fastest providers first; only those with a secret set are used.
# Workers AI is slow (~25-40 s per hint set) but reliable; Gemini's free models
# often hang or are overloaded, so Gemini is the extra capacity after it
PROVIDER_ORDER = "cerebras,groq,workersai,gemini,openrouter"
# After publishing the extension, pin the API to it, e.g.
# ALLOWED_ORIGINS = "chrome-extension://<your-extension-id>"
ALLOWED_ORIGINS = ""
# The day's token budget across all free providers, split 70/25/5 by QuotaKeeper
QUOTA_DAILY_TOKENS = "3000000"

# Remote switches served by GET /config (edit in the dashboard: Workers →
# leethint-api → Settings → Variables; the extension sees a change within 1 hour)
CONFIG_INTERVIEW = "true"
CONFIG_FIX = "true"
CONFIG_TRIAL_INTERVIEWS_PER_WEEK = "1"
CONFIG_TRIAL_INTERVIEW_MINUTES = "15"
CONFIG_TRIAL_FIXES_PER_DAY = "3"
CONFIG_MESSAGE = ""

# Cloudflare Workers AI — free daily allowance on this account, no API key
[ai]
binding = "AI"

# Per-install rate limit: 20 generate requests per minute per X-LeetHint-Install
[[ratelimits]]
name = "INSTALL_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Per-IP backstop: 120 per minute (testers often share one Wi-Fi, i.e. one IP;
# requests without an install ID — old extension versions — get only this one)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Shared hint cache (created with: npx wrangler kv namespace create HINTS_CACHE).
# The id is not a secret — it only works with this Cloudflare account.
# Without this binding everything still works; replies just aren't shared.
[[kv_namespaces]]
binding = "HINTS_CACHE"
id = "c944b3f551cc4cfab1d5bf292ffd9206"

# D1 database: shared reply cache, reports, free-trial counters, blocklist.
# Create it once, paste the printed database_id below, uncomment, then apply
# the schema (free plan; no payment method needed):
#   npx wrangler d1 create leethint
#   npx wrangler d1 migrations apply leethint --remote
# Until then the Worker keeps using KV only, and trials/reports are off.
[[d1_databases]]
binding = "DB"
database_name = "leethint"
database_id = "f811f082-7749-4111-b771-31bcb4eb800b"
migrations_dir = "migrations"

# Durable Objects (SQLite-backed ones are on the free plan; created on deploy).
# QuotaKeeper: ONE global view of every provider's limits and the day's token
# budget (70% hints, 25% trials, 5% reserve), shared by all Worker copies.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaKeeper"

# ProblemGate: one per cache key — identical cache misses share ONE AI call
[[durable_objects.bindings]]
name = "GATE"
class_name = "ProblemGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaKeeper", "ProblemGate"]

# Monitoring: one event per /v1 request (cache layer, provider, 429s, trials).
# Workers Analytics Engine is on the free plan; query it in the dashboard
# (Workers → Analytics Engine) or via the SQL API. GET /stats needs the secret:
#   npx wrangler secret put STATS_TOKEN
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "leethint_events"
