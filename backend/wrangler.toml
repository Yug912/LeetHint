# ── Merge identical requests: one AI call per new problem (task A10) ──
# Durable Objects (SQLite-backed) are on the free plan — check its current
# limits first. Uncomment both blocks and deploy; remove them to switch it off.
# [[durable_objects.bindings]]
# name = "GATE"
# class_name = "ProblemGate"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["ProblemGate"]

# ── One shared quota counter for every Worker copy (task A11) ──
# Shares the per-minute budgets and daily pauses, keeps 25% of the day for
# free trials (Fix, interviews) and admits at most 3 trial interviews at once.
# Uncomment together with the gate blocks above (one [[migrations]] list):
