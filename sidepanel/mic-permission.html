<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeetHint microphone</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --green: #00ff88; --red: #f85149; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font-family: Inter, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
    .ok { color: var(--green); }
    .err { color: var(--red); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">🎙️ Allow the microphone</h1>
    <p id="msg">Click <strong>Allow</strong> in Chrome's prompt so you can answer the mock interviewer by voice.</p>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
